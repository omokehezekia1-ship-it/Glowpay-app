
<!DOCTYPE html>
<html>

<title>GlowPay Super</title>
<style>
body{margin:0;background:#070a07;color:#fff;font-family:system-ui;padding:12px;padding-bottom:90px}
h1{color:#eaff00;text-align:center;margin:5px 0 0;font-size:32px}
.sub{text-align:center;color:#888;font-size:13px;margin-bottom:12px}
.card{background:#15151f;border:1px solid #1e3a16;border-radius:18px;padding:14px;margin-bottom:12px}
.t{color:#eaff00;font-weight:800;margin-bottom:8px;font-size:14px}
input{width:100%;box-sizing:border-box;background:#000;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;margin:6px 0}
.g{width:100%;background:#00c853;color:#fff;border:0;padding:12px;border-radius:12px;font-weight:800}
.y{width:100%;background:#eaff00;color:#000;border:0;padding:12px;border-radius:12px;font-weight:900;margin-top:8px}
.btns{display:flex;gap:6px;margin:8px 0}
.btns button{flex:1;padding:10px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff}
.btns button.active{border-color:#eaff00;color:#eaff00;background:#222}
.tab{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
.tab button{flex:1;min-width:70px;padding:10px;border-radius:20px;border:1px solid #333;background:#111;color:#fff;font-size:13px}
.tab button.active{background:#eaff00;color:#000;font-weight:900}
.game{display:none}.game.active{display:block}
.avi{height:140px;background:radial-gradient(circle at 30% 80%,#1a2f1a,#000);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden}
#mult{font-size:42px;font-weight:900;color:#eaff00}
#plane{font-size:30px;position:absolute;left:10%;bottom:20%;transition:all 0.2s}
.balance{font-size:22px;font-weight:900;text-align:center}
.small{font-size:11px;color:#888;text-align:center;margin-top:4px}
</style>
</head>
